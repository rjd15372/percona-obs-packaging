name: Sync to OBS (main)

# Runs whenever a push to main touches any file under root/.
# Syncs the full package tree to OBS, creating or updating projects and
# packages as needed, and removing any OBS packages that were deleted locally.
#
# Skipped when the push adds release.yaml files (release commits) — those
# are handled by obs-release.yml after obs-pr-cleanup.yml pushes the tag.
# Running sync push for release commits would race with obs-release.yml and
# pre-create the release OBS project structure before binaries are populated.

on:
  push:
    branches: [main]
    paths: ['root/**']
  workflow_dispatch: {}

jobs:
  sync:
    name: percona-obs sync push
    runs-on: ubuntu-latest
    permissions:
      # Required to push the badge JSON to the badges branch.
      contents: write
      # Required to post the "OBS Build" commit status.
      statuses: write
      # Required to list/watch sibling workflow runs (gh run list/watch).
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: sync push reads git log to detect
          # per-package changes since the last OBS sync commit SHA.
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # Detect whether this push adds release.yaml files.  If so, skip all
      # OBS steps — obs-release.yml will handle the release project creation
      # after obs-pr-cleanup.yml pushes the tag.
      - name: Detect release commits
        id: release-guard
        run: |
          RELEASES=$(git diff --name-only --diff-filter=A \
            "${{ github.event.before }}" HEAD \
            -- 'root/*/releases/*/release.yaml')
          if [ -n "$RELEASES" ]; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
            echo "Release files added — sync push will be skipped"
          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
          fi

      # Persists the content-addressed .cache/ tree (Phase 1 obs_scm outputs
      # and Phase 2 manual-service outputs such as go_modules vendor tarballs)
      # across runs.  Without this, every main sync regenerates vendor
      # tarballs with new file mtimes and needlessly re-uploads them.
      # Entries are content-addressed so a partial hit via restore-keys is
      # always safe: unused SHA-keyed subdirs are ignored.
      - name: Restore percona-obs cache
        if: steps.release-guard.outputs.detected != 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: percona-obs-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            percona-obs-${{ runner.os }}-

      - uses: ./.github/actions/obs-setup
        if: steps.release-guard.outputs.detected != 'true'
        with:
          obs-apiurl: ${{ vars.OBS_APIURL }}
          obs-user: ${{ vars.OBS_USER }}
          obs-password: ${{ secrets.OBS_PASSWORD }}

      - name: Create percona-obs profile
        if: steps.release-guard.outputs.detected != 'true'
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_ROOTPRJ: ${{ vars.OBS_ROOTPRJ }}
        run: |
          venv/bin/python -m percona_obs \
            -A "$OBS_APIURL" \
            -R "$OBS_ROOTPRJ" \
            -e "REMOTE_OBS_ORG_INTERCONNECT:" \
            -e "PERCONA_OBS_PACKAGING_BRANCH:main" \
            -e "PERCONA_OBS_PACKAGING_REPO:${{ github.server_url }}/${{ github.repository }}.git" \
            profile create main

      - name: Sync to OBS
        if: steps.release-guard.outputs.detected != 'true'
        run: venv/bin/python -m percona_obs --verbose -P main sync push --no-scm-validate

      # Poll OBS until all builds reach a terminal state, then set a dedicated
      # "OBS Build" commit status (success / failure / error on timeout).
      - name: Poll OBS build status
        id: poll
        if: steps.release-guard.outputs.detected != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_ROOTPRJ: ${{ vars.OBS_ROOTPRJ }}
          OBS_WEB_URL: ${{ vars.OBS_WEB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: venv/bin/python .github/scripts/poll_obs_builds.py

      # Update docs/versions/<dist>.md for each distribution project touched
      # by this push, and refresh the README "## Version Lists" section.
      # Only runs when OBS builds all succeed.
      - name: Update version lists
        if: steps.release-guard.outputs.detected != 'true' && steps.poll.outcome == 'success'
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          OBS_WEB_URL: ${{ vars.OBS_WEB_URL }}
          OBS_ROOTPRJ: ${{ vars.OBS_ROOTPRJ }}
          PYTHONPATH: ${{ github.workspace }}
        run: venv/bin/python .github/scripts/update_version_lists.py

      # Push the badge JSON to the orphan `badges` branch so it can be
      # embedded in README.md via a shields.io endpoint badge.
      # Runs even when the poll step fails so the badge always reflects the
      # latest build outcome.
      - name: Publish OBS build badge
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f /tmp/obs-build-badge.json ] || exit 0
          BADGE=$(base64 -w0 /tmp/obs-build-badge.json)
          FILE_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/obs-build-badge.json?ref=badges" \
            --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$FILE_SHA" ]; then
            gh api "repos/$GITHUB_REPOSITORY/contents/obs-build-badge.json" \
              -X PUT \
              -f message="ci: update OBS build badge" \
              -f content="$BADGE" \
              -f branch=badges \
              -f sha="$FILE_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/contents/obs-build-badge.json" \
              -X PUT \
              -f message="ci: update OBS build badge" \
              -f content="$BADGE" \
              -f branch=badges
          fi
