name: Build obs-tools Docker image

# Rebuilds and publishes ghcr.io/<owner>/obs-tools:latest whenever the
# Dockerfile or Python dependencies change.  All workflow jobs that call
# .github/actions/obs-setup run inside this container so they don't have to
# reinstall OBS service binaries, Go, gh CLI, or the Python venv on every run.

on:
  push:
    branches: [main]
    paths:
      - '.github/docker/obs-tools/Dockerfile'
      - 'requirements.txt'
  workflow_dispatch: {}

jobs:
  build:
    name: Build and push obs-tools image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/obs-tools/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/obs-tools:latest
            ghcr.io/${{ github.repository_owner }}/obs-tools:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
