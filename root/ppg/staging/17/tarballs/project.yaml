title: Percona PostgreSQL %!{PG_MAJOR_VERSION} Tarballs
description: |
  Binary tarball (simpleimage) builds for Percona Software for PostgreSQL
  %!{PG_MAJOR_VERSION}. Each repository is one SSL variant of the official
  tarball, built against a different base of ppg:staging:%!{PG_MAJOR_VERSION}:
  ssl1.1 (RockyLinux 8), ssl3 (Ubuntu 22.04), ssl3.5 (RockyLinux 10).

repositories:
  - name: ssl1.1
    paths:
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: RockyLinux_8
      - subproject: ppg:common:deps
        repository: RockyLinux_8
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:8
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: appstream
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: baseos
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: devel
    archs: [x86_64]
  # ssl3 is deb-based (Ubuntu 22.04, OpenSSL 3.0.2 / glibc 2.35): the EL9
  # base could not keep the "ssl3 runs on any OpenSSL 3.0 host" promise —
  # Rocky 9.8+ ships OpenSSL 3.5.x, so staging-built binaries (pgcrypto.so)
  # reference OPENSSL_3.4.0 version nodes and the verification gate fails
  # them. The staging Ubuntu 22.04 debs reference only OPENSSL_3.0.0.
  - name: ssl3
    paths:
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: Ubuntu_22.04
      - subproject: ppg:common:deps
        repository: Ubuntu_22.04
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Ubuntu:22.04
        repository: universe
    archs: [x86_64]
  - name: ssl3.5
    paths:
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: RockyLinux_10
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:10
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:10
        repository: standard
    archs: [x86_64]

publish:
  ssl1.1: true
  ssl3: true
  ssl3.5: true

project-config: |
  Type: simpleimage

  %if "%_repository" == "ssl1.1"
  # Same install-time resolution hints as staging RockyLinux_8.
  ExpandFlags: module:llvm-toolset-rhel8
  ExpandFlags: module:perl-5.26
  ExpandFlags: module:perl-IO-Socket-SSL-2.066
  ExpandFlags: module:perl-libwww-perl-6.34
  Prefer: python3-devel
  Prefer: selinux-policy-targeted
  %endif

  # ssl3 (deb-based, Ubuntu 22.04) currently needs no extra resolution
  # hints; if the first OBS build reports unresolvable/have-choice errors,
  # add a %_repository == "ssl3" block here with the needed Prefer/Ignore.

  %if "%_repository" == "ssl3.5"
  # Same install-time resolution hints as staging RockyLinux_10.
  Prefer: selinux-policy-targeted
  Prefer: hdf-libs
  %endif
