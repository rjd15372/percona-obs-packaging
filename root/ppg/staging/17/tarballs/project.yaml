title: Percona PostgreSQL %!{PG_MAJOR_VERSION} Tarballs
description: |
  Binary tarball (simpleimage) builds for Percona Software for PostgreSQL
  %!{PG_MAJOR_VERSION}. Each repository is one SSL variant of the official
  tarball, built against a different base of ppg:staging:%!{PG_MAJOR_VERSION}:
  ssl1.1 (RockyLinux 8), ssl3 (Ubuntu 22.04), ssl3.5 (RockyLinux 10).

repositories:
  - name: ssl1.1
    paths:
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: RockyLinux_8
      - subproject: ppg:common:deps
        repository: RockyLinux_8
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:8
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: appstream
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: baseos
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: devel
    archs: [x86_64]
  # ssl3 is deb-based (Ubuntu 22.04, OpenSSL 3.0.2 / glibc 2.35): the EL9
  # base could not keep the "ssl3 runs on any OpenSSL 3.0 host" promise —
  # Rocky 9.8+ ships OpenSSL 3.5.x, so staging-built binaries (pgcrypto.so)
  # reference OPENSSL_3.4.0 version nodes and the verification gate fails
  # them. The staging Ubuntu 22.04 debs reference only OPENSSL_3.0.0.
  - name: ssl3
    paths:
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: Ubuntu_22.04
      - subproject: ppg:common:deps
        repository: Ubuntu_22.04
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Ubuntu:22.04
        repository: universe
    archs: [x86_64]
  - name: ssl3.5
    paths:
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: RockyLinux_10
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:10
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:10
        repository: standard
    archs: [x86_64]

publish:
  ssl1.1: true
  ssl3: true
  ssl3.5: true

project-config: |
  Type: simpleimage

  %if "%_repository" == "ssl1.1"
  # Explicit binary format: "Type: simpleimage" above disables obs-build's
  # recipe-type guessing (which would have derived it from the Preinstall
  # list), and simpleimage is not one of the image types (kiwi, docker, ...)
  # for which Build.pm re-derives the binary format, so without this the
  # repo resolves with binarytype UNDEFINED. Harmless for RPM repos (the
  # expander falls back to RPM semantics) but declare it anyway.
  Binarytype: rpm
  # Same install-time resolution hints as staging RockyLinux_8.
  ExpandFlags: module:llvm-toolset-rhel8
  ExpandFlags: module:perl-5.26
  ExpandFlags: module:perl-IO-Socket-SSL-2.066
  ExpandFlags: module:perl-libwww-perl-6.34
  Prefer: python3-devel
  Prefer: selinux-policy-targeted
  # glibc requires the virtual "glibc-langpack"; every glibc-langpack-*
  # (plus glibc-all-langpacks and glibc-minimal-langpack) provides it, and
  # image-type expansion resolves the full runtime closure while ignoring
  # the base config's "Ignore: glibc:glibc-langpack" rule, so OBS reports
  # "have choice for glibc-langpack needed by glibc". Pick the minimal
  # langpack (same fix as the ubi9 container project config).
  Prefer: glibc-minimal-langpack
  %endif

  %if "%_repository" == "ssl3"
  # Explicit binary format for the deb repo. "Type: simpleimage" above
  # disables obs-build's recipe-type guessing (staging's Ubuntu_22.04 repo
  # is guessed as Type dsc from the "debianutils" Preinstall, which implies
  # binarytype deb), and simpleimage is not one of the image types (kiwi,
  # docker, ...) for which Build.pm re-derives the binary format from the
  # Preinstall list. Without this line the repo resolves with binarytype
  # UNDEFINED, i.e. RPM dependency/conflict semantics applied to the deb
  # metadata, which breaks the preinstall expansion ("unresolvable:
  # preinstalls: conflict for providers of perl-base >= 5.20.1-3 needed by
  # init-system-helpers").
  Binarytype: deb
  %endif

  %if "%_repository" == "ssl3.5"
  # Explicit binary format (see the ssl1.1/ssl3 comments).
  Binarytype: rpm
  # Same install-time resolution hints as staging RockyLinux_10.
  Prefer: selinux-policy-targeted
  Prefer: hdf-libs
  # python3 is 3.12 on EL10, so the EPEL10/Rocky 10 python3-foo packages
  # also provide "python3.12-foo" and OBS reports "have choice" between
  # them and our staging python3.12-foo packages for every percona-patroni
  # dependency that both sides ship. Prefer our packages.
  Prefer: python3.12-wcwidth
  Prefer: python3.12-dateutil
  Prefer: python3.12-six
  Prefer: python3.12-click
  Prefer: python3.12-prettytable
  Prefer: python3.12-psutil
  Prefer: python3.12-boto3
  Prefer: python3.12-dns
  # Not in the first OBS error report (the resolver stops at the
  # python3.12-boto3 choice), but EPEL10's python3-botocore also provides
  # python3.12-botocore, so the same choice surfaces once boto3 resolves.
  Prefer: python3.12-botocore
  # boto3/botocore carry rich requires on python3.12dist(jmespath) and
  # python3.12dist(s3transfer); EPEL10's python3-jmespath/python3-s3transfer
  # provide those dist names too (python3 = 3.12 on EL10), colliding with
  # our staging python3.12-jmespath/python3.12-s3transfer packages.
  Prefer: python3.12-jmespath
  Prefer: python3.12-s3transfer
  # Defensive: percona-patroni requires python3.12-psycopg2. Today Rocky
  # 10's python3-psycopg2 (which also provides python3.12-psycopg2) is
  # shadowed by our same-named python3-psycopg2 transition package, so
  # there is no choice, but prefer ours explicitly in case that changes.
  Prefer: python3.12-psycopg2
  # No glibc-langpack Prefer needed here: unlike Rocky 8, the EL10 base
  # configs already carry "Prefer: glibc-langpack-en".
  %endif
