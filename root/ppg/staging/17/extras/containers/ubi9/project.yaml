title: Percona UBI-9 Container Custom Images for PostgreSQL %!{PG_MAJOR_VERSION}
description: |
  This project contains UBI-9 based container custom images for Percona Software for PostgreSQL %!{PG_MAJOR_VERSION}.

repositories:
  - name: images
    paths:
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}:extras
        repository: UBI_9
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: UBI_9
      - subproject: ppg:staging:%!{PG_PREV_MAJOR_VERSION}
        repository: UBI_9
      - subproject: ppg:common:deps
        repository: UBI_9
      - subproject: common:containers:ubi9
        repository: images
      - subproject: common:containers:ubi9
        repository: UBI_9
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:9
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RedHat:UBI-9
        repository: standard
    archs: [x86_64, aarch64]

project-config: |
  %if "%_repository" == "images"
  Type: docker
  BuildEngine: podman

  Preinstall: skopeo

  ExpandFlags: filterbasecontainerpkgs
  Prefer: redhat-release
  Prefer: glibc-minimal-langpack
  Prefer: gpgme
  Prefer: iptables-nft
  Prefer: percona-postgresql%!{PG_MAJOR_VERSION}-libs
  Ignore: rocky-release

  Prefer: glibc-minimal-langpack

  BuildFlags: sbom:spdx
  BuildFlags: sbom:cyclonedx
  PublishFlags: withsbom
  %endif

qa:
  - pipeline: docker-server-parallel-generic
    parameters:
      DOCKER_TAG: %!{PG_MAJOR_VERSION}
      SERVER_VERSION: %!{PG_VERSION}
      TESTING_BRANCH: ricardo-work
      REPOSITORY: registry.opensuse.org/${OBS_CONTAINER_REGISTRY_ROOTPRJ}/ppg/staging/17/extras/containers/ubi9/images
      WITH_POSTGIS:
        - true
        - false
    matrix:
      - WITH_POSTGIS

  - pipeline: ppg-obs-upgrade
    parameters:
      REPOSITORY: registry.opensuse.org/${OBS_CONTAINER_REGISTRY_ROOTPRJ}/ppg/staging/17/extras/containers/ubi9/images
      OLD_SERVER_VERSION: "16.14"
      NEW_SERVER_VERSION: %!{PG_VERSION}
      UPGRADE_DOCKER_TAG: %!{PG_MAJOR_VERSION}-%!{PG_PREV_MAJOR_VERSION}
      OLD_DOCKER_REPOSITORY: registry.opensuse.org/isv/percona/ppg/staging/%!{PG_PREV_MAJOR_VERSION}/extras/containers/ubi9/images
      TESTING_BRANCH: ricardo-work
