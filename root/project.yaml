title: Percona OBS Packaging
description: "OBS RPM and DEB packaging for Percona products."
repositories:
  - name: RockyLinux_9
    paths:
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:9
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:9
        repository: standard
      - subproject: common:deps:build
        repository: RockyLinux_9
    archs: [x86_64, aarch64]
  - name: RockyLinux_10
    paths:
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:10
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:10
        repository: standard
      - subproject: common:deps:build
        repository: RockyLinux_10
    archs: [x86_64, aarch64]
  - name: UBI_9
    paths:
      - subproject: common:deps:build
        repository: UBI_9
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:9
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RedHat:UBI-9
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:9
        repository: devel
    archs: [x86_64, aarch64]
  - name: UBI_8
    paths:
      - subproject: common:deps:build
        repository: UBI_8
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:8
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RedHat:UBI-8
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: appstream
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: baseos
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: devel
    archs: [x86_64, aarch64]
  - name: Debian_13
    paths:
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Debian:13
        repository: standard
      - subproject: common:deps:build
        repository: Debian_13
    archs: [x86_64, aarch64]
  - name: Ubuntu_24.04
    paths:
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Ubuntu:24.04
        repository: universe
      - subproject: common:deps:build
        repository: Ubuntu_24.04
    archs: [x86_64, aarch64]
  - name: Ubuntu_26.04
    paths:
      - subproject: common:deps:build
        repository: Ubuntu_26.04
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Ubuntu:26.04
        repository: universe
    archs: [x86_64, aarch64]
  - name: openSUSE_Tumbleweed
    paths:
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}openSUSE:Tumbleweed
        repository: standard
      - subproject: common:deps:build
        repository: openSUSE_Tumbleweed
    archs: [x86_64, aarch64]
  - name: openSUSE_Leap_16
    paths:
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}openSUSE:Leap:16.0
        repository: standard
      - subproject: common:deps:build
        repository: openSUSE_Leap_16
    archs: [x86_64, aarch64]

project-config: |
  %if "%_repository" == "RockyLinux_8" || "%_repository" == "UBI_8"
  ExpandFlags: module:llvm-toolset-rhel8
  ExpandFlags: module:perl-5.26
  ExpandFlags: module:perl-IO-Socket-SSL-2.066
  ExpandFlags: module:perl-libwww-perl-6.34
  Prefer: selinux-policy-targeted
  %endif

  %if "%_repository" == "RockyLinux_9"
  ExpandFlags: module:llvm-toolset-rhel9
  # hdf-libs (EPEL split package) and hdf both provide libdf.so.0 and libmfhdf.so.0
  Prefer: hdf-libs
  %endif

  %if "%_repository" == "Debian_13" || "%_repository" == "Ubuntu_24.04" || "%_repository" == "Ubuntu_26.04"
  # libgdal-dev transitively requires both libcurl4-openssl-dev and
  # libcurl4-gnutls-dev which conflict; ignore the gnutls variant so
  # the openssl variant is used consistently.
  Ignore: libcurl4-gnutls-dev
  # libgdal-dev and several of its deps use libjpeg-dev which is provided
  # by both libjpeg62-turbo-dev and libjpeg-dev; prefer the turbo variant.
  Prefer: libjpeg62-turbo-dev
  %endif

  %if "%_repository" == "Debian_13" || "%_repository" == "Ubuntu_24.04"
  Prefer: golang-1.26
  %endif

