title: cargo-pgrx 0.18.0 build tool
description: |
  cargo-pgrx 0.18.0 — the build orchestrator for pgrx-based PostgreSQL
  extensions. Pinned to match extensions that depend on the pgrx 0.18.0
  runtime (e.g. postgresql_anonymizer). RPM-only; consumed via
  `BuildRequires: cargo-pgrx = 0.18.0`.

build:
  # RHEL 8's rust (pulled by BuildRequires: cargo) needs libLLVM.so.20.1,
  # which the EL8 repo/module path doesn't provide. No RHEL 8 pgrx consumer
  # exists, so disable it rather than bundle a self-contained toolchain.
  RockyLinux_8: false
  UBI_8: false
  Debian_13: false
  Ubuntu_24.04: false
  Ubuntu_26.04: false
  openSUSE_Leap_16: false
  openSUSE_Tumbleweed: false
